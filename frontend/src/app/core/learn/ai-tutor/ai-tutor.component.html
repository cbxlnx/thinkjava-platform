<div class="ai-tutor-card">
  <div class="tutor-header">
    <div class="tutor-icon">🤖</div>
    <h3>AI Tutor</h3>
  </div>

  <div class="chip-row">
    <button
      type="button"
      class="chip"
      (click)="askPreset('Explain the lesson topic ' + topicLabel + ' simply for a beginner')">
      Simplify this
    </button>

    <button
      type="button"
      class="chip"
      (click)="askPreset('Show another simple beginner-friendly example for ' + topicLabel + '. You may create a new example if needed, but keep it within this lesson topic.')">
      Show another example
    </button>

    <button
      type="button"
      class="chip"
      (click)="askPreset('Help me understand my mistake in the lesson topic ' + topicLabel + '. If I have not provided an error yet, ask me to paste my code or error message.')">
      Explain my error
    </button>
  </div>

  <div class="tutor-messages">
    <div class="tutor-message intro">
      <div class="message-icon">🤖</div>
      <div class="message-bubble intro-bubble">
        Hi! I'm your AI Tutor. I'm here to help you solve this challenge.
        Feel free to ask me anything about <b>{{ topicLabel }}</b>.
      </div>
    </div>

    <div class="tutor-message answer-block" *ngIf="tutorAnswer">
      <div class="message-icon">🤖</div>
      <div class="message-bubble answer-bubble">
        <div [innerHTML]="tutorAnswer"></div>
      </div>
    </div>

    <div class="hint small" *ngIf="tutorLoading">Thinking...</div>
    <div class="error small" *ngIf="tutorError">{{ tutorError }}</div>
  </div>

  <div class="tutor-input-row">
    <input
      class="tutor-input"
      [(ngModel)]="tutorQuestion"
      placeholder="Ask Tutor..."
      (keyup.enter)="askTutor()" />

    <button
      class="send-btn"
      type="button"
      (click)="askTutor()"
      [disabled]="tutorLoading">
      ➤
    </button>
  </div>
</div>
