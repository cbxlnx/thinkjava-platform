<div class="auth-page">

  <!-- BRAND ABOVE CARD -->
  <header class="page-brand">
    <div class="brand">
      <div class="brand-icon">{{ '{ }' }}</div>
      <div class="brand-text">
        <div class="brand-name">ThinkJava</div>
        <div class="brand-tagline">AI-Powered Adaptive Java Learning</div>
      </div>
    </div>
  </header>

  <!-- REGISTER CARD -->
  <div class="auth-card">

    <div class="auth-title">
      <h1>Welcome to ThinkJava</h1>
      <p>Start your personalized Java learning journey</p>
    </div>

    <!-- TOGGLE -->
    <div class="auth-toggle">
      <a class="toggle-btn" routerLink="/login">Login</a>
      <a class="toggle-btn active" routerLink="/register">Sign Up</a>
    </div>

    <!-- FORM -->
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">

      <label class="field">
        <span>Email</span>
        <input type="email" placeholder="your.email@example.com" formControlName="email"
          [class.input-error]="(form.controls.email.dirty || form.controls.email.touched) && form.controls.email.invalid" />

        <div class="error"
          *ngIf="(form.controls.email.dirty || form.controls.email.touched) && form.controls.email.errors">
          <span *ngIf="form.controls.email.errors['required']">Email is required</span>
          <span *ngIf="form.controls.email.errors['email']">Enter a valid email (must include @)</span>
        </div>
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" placeholder="Create a password" formControlName="password"
          [class.input-error]="(form.controls.password.dirty || form.controls.password.touched) && form.controls.password.invalid" />

        <div class="error"
          *ngIf="(form.controls.password.dirty || form.controls.password.touched) && form.controls.password.errors">
          <span *ngIf="form.controls.password.errors['required']">Password is required</span>
          <span *ngIf="form.controls.password.errors['minlength']">
            Minimum 6 characters required
          </span>
        </div>
      </label>

      <label class="field">
        <span>Confirm Password</span>
        <input type="password" placeholder="Confirm your password" formControlName="confirmPassword"
          [class.input-error]="(form.controls.confirmPassword.dirty || form.controls.confirmPassword.touched) && form.controls.confirmPassword.invalid" />

        <div class="error" *ngIf="(form.controls.confirmPassword.dirty || form.controls.confirmPassword.touched)">
          <span *ngIf="form.controls.confirmPassword.errors?.['required']">
            Please confirm your password
          </span>
          <span *ngIf="form.value.password !== form.value.confirmPassword">
            Passwords do not match
          </span>
        </div>
      </label>

      <button class="primary-btn" type="submit" [disabled]="form.invalid">
        Create Account &amp; Take Diagnostic Quiz
      </button>

      <p class="error" *ngIf="error">{{ error }}</p>

      <div class="auth-row">
        <a class="link" routerLink="/login">Back to login</a>
      </div>

    </form>
  </div>

  <!-- FOOTER BELOW CARD -->
  <footer class="page-footer">
    <div class="copyright">
      © 2026 ThinkJava — Adaptive Learning Platform
    </div>

    <div class="chips">
      <span class="chip">AI-Powered Learning</span>
      <span class="chip">Personalized Path</span>
      <span class="chip">Instant Feedback</span>
    </div>
  </footer>

</div>
